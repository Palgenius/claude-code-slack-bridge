name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The server is Windows-first in practice, but nothing in the tested modules
    # is platform-specific and Linux is faster. Both are run so path handling
    # cannot quietly regress on one of them.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20.x', '22.x']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
